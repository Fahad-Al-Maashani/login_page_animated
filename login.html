<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyberpunk Login</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="crt-overlay"></div> <!-- CRT Flicker Effect -->

    <div class="login-container pixelated">
        <h1 class="neon-text">Welcome to the Cyber Realm</h1>
        <form id="login-form">
            <input type="text" id="username" placeholder="Username" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>
        <p id="error-message" class="marquee">Enter your credentials...</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
